server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Gateway 保留公共路径原样转发；Nginx 只在静态文件查找时去掉页面前缀。
    location = /app/feedback {
        return 308 /app/feedback/;
    }

    location = /app/feedback/ {
        rewrite ^/app/feedback/$ /index.html break;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location ^~ /app/feedback/assets/ {
        rewrite ^/app/feedback/(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /app/feedback/ {
        rewrite ^/app/feedback/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # 页面和 API 共用此业务 Nginx；Feedback runtime 在同一业务网络监听 8393。
    location = /api/feedback {
        return 308 /api/feedback/;
    }

    location ^~ /api/feedback/ {
        proxy_pass http://feedback-server:8393;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
    }
}
